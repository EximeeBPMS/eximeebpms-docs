server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve behind a remapped host port (e.g. docker-compose 8080->80) without
    # nginx's automatic directory-redirects hardcoding its own internal port.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
