<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="title desc"> <title id="title">Script Guard Rollout Flow</title> <desc id="desc">A top-to-bottom flowchart showing the recommended rollout process for enabling Script Guard in audit mode, monitoring violations, reviewing and fixing findings, and switching to enforce mode.</desc> <defs> <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%"> <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/> </filter>
  <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 10 4 L 0 8 Z" fill="#555555"/>
  </marker>
</defs> <rect x="0" y="0" width="600" height="820" fill="#ffffff"/> <g font-family="Arial, Helvetica, sans-serif" font-size="13"> <rect x="190" y="30" width="220" height="60" rx="6" ry="6" fill="#4CAF50" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/> <text x="300" y="56" text-anchor="middle" fill="#ffffff" font-weight="600"> <tspan x="300" dy="0">Script Guard enabled</tspan> <tspan x="300" dy="18">(mode: AUDIT)</tspan> </text>
  <rect x="190" y="125" width="220" height="60" rx="6" ry="6" fill="#1976D2" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="300" y="151" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="300" dy="0">Monitor violations</tspan>
    <tspan x="300" dy="18">via REST API</tspan>
  </text>

  <polygon points="300,220 395,265 300,310 205,265" fill="#FFA726" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="300" y="261" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="300" dy="0">Violations</tspan>
    <tspan x="300" dy="18">found?</tspan>
  </text>

  <rect x="50" y="350" width="220" height="60" rx="6" ry="6" fill="#1976D2" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="160" y="376" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="160" dy="0">Review violation</tspan>
    <tspan x="160" dy="18">rule code + process key</tspan>
  </text>

  <polygon points="160,455 255,500 160,545 65,500" fill="#FFA726" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="160" y="496" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="160" dy="0">Process</tspan>
    <tspan x="160" dy="18">trusted?</tspan>
  </text>

  <rect x="50" y="590" width="220" height="60" rx="6" ry="6" fill="#1976D2" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="160" y="616" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="160" dy="0">Add process key</tspan>
    <tspan x="160" dy="18">to allowlist</tspan>
  </text>

  <rect x="330" y="590" width="220" height="60" rx="6" ry="6" fill="#1976D2" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="440" y="616" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="440" dy="0">Fix script</tspan>
    <tspan x="440" dy="18">(remove blocked pattern)</tspan>
  </text>

  <rect x="330" y="350" width="220" height="60" rx="6" ry="6" fill="#1976D2" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="440" y="376" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="440" dy="0">Switch mode</tspan>
    <tspan x="440" dy="18">to ENFORCE</tspan>
  </text>

  <rect x="330" y="475" width="220" height="60" rx="6" ry="6" fill="#4CAF50" stroke="#333333" stroke-width="1.5" filter="url(#nodeShadow)"/>
  <text x="440" y="501" text-anchor="middle" fill="#ffffff" font-weight="600">
    <tspan x="440" dy="0">Script Guard</tspan>
    <tspan x="440" dy="18">enforcing</tspan>
  </text>

  <path d="M 300 90 L 300 125" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 300 185 L 300 220" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <path d="M 205 265 L 160 265 L 160 350" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="175" y="257" text-anchor="middle" fill="#555555" font-style="italic" font-size="12">YES</text>

  <path d="M 395 265 L 440 265 L 440 350" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="425" y="257" text-anchor="middle" fill="#555555" font-style="italic" font-size="12">NO</text>

  <path d="M 160 410 L 160 455" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <path d="M 160 545 L 160 590" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="178" y="570" text-anchor="start" fill="#555555" font-style="italic" font-size="12">YES</text>

  <path d="M 255 500 L 300 500 L 300 565 L 440 565 L 440 590" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="278" y="492" text-anchor="middle" fill="#555555" font-style="italic" font-size="12">NO</text>

  <path d="M 440 410 L 440 475" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <path d="M 160 650 L 160 705 L 25 705 L 25 155 L 190 155" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 440 650 L 440 735 L 15 735 L 15 145 L 190 145" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</g> </svg>
